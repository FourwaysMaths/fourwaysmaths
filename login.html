<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fourways Maths | Portal Access</title>
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      /* Sleek Grey & Vibrant Yellow Color Theme */
      --primary-grey: #1E293B;      /* Deep Slate Grey */
      --secondary-grey: #334155;    /* Accent Slate Grey */
      --yellow-accent: #EAB308;    /* Vibrant Yellow/Gold */
      --yellow-hover: #CA8A04;     /* Darker Gold Hover */
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --border: #E2E8F0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { 
      background-color: var(--bg); 
      color: var(--text-main); 
      min-height: 100vh; 
      display: flex; 
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px 20px;
    }

    /* Container Box */
    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-top: 6px solid var(--yellow-accent);
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 10px 25px rgba(30, 41, 59, 0.08);
      text-align: center;
      position: relative;
    }

    /* Branding / Logo Area */
    .brand-logo-container {
      display: block;
      margin-bottom: 24px;
      text-decoration: none;
    }

    .brand-logo-img {
      height: 95px !important;
      max-height: none !important;
      width: auto;
      object-fit: contain;
      transition: transform 0.2s ease;
    }

    .brand-logo-img:hover {
      transform: scale(1.04);
    }

    .auth-header h2 {
      color: var(--primary-grey);
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .auth-header p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    .admin-badge {
      display: none;
      background-color: #1E293B;
      color: #EAB308;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    /* Form Inputs */
    .form-group {
      text-align: left;
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary-grey);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      background: #F8FAFC;
      transition: all 0.2s ease;
      outline: none;
    }

    .form-control:focus {
      background: #FFFFFF;
      border-color: var(--yellow-accent);
      box-shadow: 0 0 0 3px rgba(234, 179, 8, 0.2);
    }

    /* Buttons */
    .btn-primary {
      width: 100%;
      background-color: var(--yellow-accent);
      color: var(--primary-grey);
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-top: 8px;
    }

    .btn-primary:hover {
      background-color: var(--yellow-hover);
    }

    /* Alerts */
    .alert {
      padding: 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 16px;
      display: none;
      text-align: left;
    }

    .alert-error {
      background-color: #FEF2F2;
      color: #DC2626;
      border: 1px solid #FCA5A5;
    }

    .alert-success {
      background-color: #F0FDF4;
      color: #166534;
      border: 1px solid #BBF7D0;
    }

    /* Footer Switch Links */
    .footer-link {
      margin-top: 20px;
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .footer-link button, .footer-link a {
      background: none;
      border: none;
      color: var(--primary-grey);
      font-weight: 700;
      cursor: pointer;
      font-size: 0.88rem;
      text-decoration: underline;
      padding: 0;
    }

    .admin-toggle-wrapper {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px dashed var(--border);
    }

    .admin-toggle-wrapper button {
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.82rem;
    }

    .admin-toggle-wrapper button:hover {
      color: var(--primary-grey);
    }

    /* Hidden element helper */
    .register-only {
      display: none;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <a href="index.html" class="brand-logo-container">
      <img src="images/logo.png" alt="Fourways Maths Logo" class="brand-logo-img" onerror="this.src='https://via.placeholder.com/200x95/1E293B/EAB308?text=Fourways+Maths'">
    </a>

    <div class="auth-header">
      <span id="admin-badge" class="admin-badge">Educator Portal</span>
      <h2 id="form-title">Portal Login</h2>
      <p id="form-subtitle">Welcome back! Choose your account type and sign in.</p>
    </div>

    <div id="alert-msg" class="alert"></div>

    <form id="auth-form">
      <!-- LOGIN ROLE (Learner / Parent Selection) -->
      <div class="form-group" id="group-login-role">
        <label for="login-role">Signing In As</label>
        <select id="login-role" class="form-control">
          <option value="student" selected>Learner / Student</option>
          <option value="parent">Parent / Guardian</option>
        </select>
      </div>

      <!-- ACCOUNT ROLE (Register Mode Only) -->
      <div class="form-group register-only" id="group-role">
        <label for="account-role">Account Type</label>
        <select id="account-role" class="form-control">
          <option value="student" selected>Learner / Student</option>
          <option value="parent">Parent / Guardian</option>
        </select>
      </div>

      <!-- PARENT NAME (Register Mode Only) -->
      <div class="form-group register-only" id="group-parent-name">
        <label for="parent-name">Parent / Guardian Full Name</label>
        <input type="text" id="parent-name" class="form-control" placeholder="e.g. John Smith">
      </div>

      <!-- LEARNER NAME (Register Mode Only) -->
      <div class="form-group register-only" id="group-learner-name">
        <label for="learner-name">Learner Full Name</label>
        <input type="text" id="learner-name" class="form-control" placeholder="e.g. Kevin Smith">
      </div>

      <!-- LEARNER GRADE (Register Mode Only) -->
      <div class="form-group register-only" id="group-grade">
        <label for="grade">Learner Grade</label>
        <select id="grade" class="form-control">
          <option value="" disabled selected>Select Grade</option>
          <option value="Grade 8">Grade 8</option>
          <option value="Grade 9">Grade 9</option>
          <option value="Grade 10">Grade 10</option>
          <option value="Grade 11">Grade 11</option>
          <option value="Grade 12">Grade 12</option>
        </select>
      </div>

      <!-- EMAIL -->
      <div class="form-group">
        <label for="email" id="label-email">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
      </div>

      <!-- PASSWORD -->
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required minlength="6">
      </div>

      <button type="submit" class="btn-primary" id="btn-submit">Sign In</button>
    </form>

    <div class="footer-link" id="register-toggle-row">
      <span id="toggle-prompt">Don't have an account?</span>
      <button type="button" id="btn-toggle-mode">Register here</button>
    </div>

    <div class="footer-link admin-toggle-wrapper">
      <button type="button" id="btn-toggle-admin">Educator / Admin Sign In</button>
    </div>
  </div>

<script>
  // Initialize Supabase Client
  const SUPABASE_URL = "https://iajuctffwesmsumopoqu.supabase.co";
  const SUPABASE_KEY = "sb_publishable_ayM8pw97h1RpKpXcKEtnBA_TBRg2V-1";
  const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

  let isRegisterMode = false;
  let isAdminMode = false;

  const authForm = document.getElementById('auth-form');
  const alertMsg = document.getElementById('alert-msg');
  const btnSubmit = document.getElementById('btn-submit');
  const btnToggleMode = document.getElementById('btn-toggle-mode');
  const btnToggleAdmin = document.getElementById('btn-toggle-admin');
  
  const formTitle = document.getElementById('form-title');
  const formSubtitle = document.getElementById('form-subtitle');
  const togglePrompt = document.getElementById('toggle-prompt');
  const adminBadge = document.getElementById('admin-badge');
  const registerToggleRow = document.getElementById('register-toggle-row');
  
  const registerFields = document.querySelectorAll('.register-only');
  const groupLoginRole = document.getElementById('group-login-role');
  const parentNameInput = document.getElementById('parent-name');
  const learnerNameInput = document.getElementById('learner-name');
  const gradeInput = document.getElementById('grade');
  const roleInput = document.getElementById('account-role');
  const loginRoleInput = document.getElementById('login-role');
  const emailLabel = document.getElementById('label-email');

  // Central Role Router
  function redirectUserByRole(role) {
    if (role === "parent") {
      window.location.href = "parent-dashboard.html";
    } else if (role === "admin" || role === "educator") {
      window.location.href = "admin.html";
    } else {
      window.location.href = "dashboard.html";
    }
  }

  // Auto-redirect if already logged in + handle URL parameters
  document.addEventListener("DOMContentLoaded", async () => {
    if (supabaseClient) {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session?.user) {
        redirectUserByRole(session.user.user_metadata?.role || "student");
        return;
      }
    }

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('mode') === 'register') {
      btnToggleMode.click();
    } else if (urlParams.get('mode') === 'admin') {
      btnToggleAdmin.click();
    }
  });

  // Dynamic field toggling for Registration Role Selection
  roleInput.addEventListener('change', () => {
    if (roleInput.value === 'parent') {
      learnerNameInput.required = false;
      gradeInput.required = false;
    } else {
      learnerNameInput.required = true;
      gradeInput.required = true;
    }
  });

  // Toggle Admin / Educator Specific View
  btnToggleAdmin.addEventListener('click', () => {
    isAdminMode = !isAdminMode;
    isRegisterMode = false;
    hideAlert();

    if (isAdminMode) {
      adminBadge.style.display = 'inline-block';
      formTitle.textContent = "Educator Command Access";
      formSubtitle.textContent = "Sign in with your admin credentials to access teacher controls.";
      btnSubmit.textContent = "Sign In as Admin";
      groupLoginRole.style.display = 'none';
      registerToggleRow.style.display = 'none';
      registerFields.forEach(el => el.style.display = 'none');
      btnToggleAdmin.textContent = "← Switch to Learner / Parent Login";
      if (emailLabel) emailLabel.textContent = "Admin Email Address";
    } else {
      adminBadge.style.display = 'none';
      formTitle.textContent = "Portal Login";
      formSubtitle.textContent = "Welcome back! Choose your account type and sign in.";
      btnSubmit.textContent = "Sign In";
      groupLoginRole.style.display = 'block';
      registerToggleRow.style.display = 'block';
      togglePrompt.textContent = "Don't have an account?";
      btnToggleMode.textContent = "Register here";
      btnToggleAdmin.textContent = "Educator / Admin Sign In";
      if (emailLabel) emailLabel.textContent = "Email Address";
    }
  });

  // Toggle between Login & Registration view
  btnToggleMode.addEventListener('click', () => {
    isRegisterMode = !isRegisterMode;
    isAdminMode = false;
    adminBadge.style.display = 'none';
    btnToggleAdmin.textContent = "Educator / Admin Sign In";
    hideAlert();

    if (isRegisterMode) {
      formTitle.textContent = "Create an Account";
      formSubtitle.textContent = "Fill in the details below to register for portal access.";
      btnSubmit.textContent = "Register Account";
      togglePrompt.textContent = "Already registered?";
      btnToggleMode.textContent = "Sign in here";

      groupLoginRole.style.display = 'none';
      registerFields.forEach(el => el.style.display = 'block');
      
      parentNameInput.required = true;
      if (roleInput.value === 'student') {
        learnerNameInput.required = true;
        gradeInput.required = true;
      }

      if (emailLabel) emailLabel.textContent = "Email Address";
    } else {
      formTitle.textContent = "Portal Login";
      formSubtitle.textContent = "Welcome back! Choose your account type and sign in.";
      btnSubmit.textContent = "Sign In";
      togglePrompt.textContent = "Don't have an account?";
      btnToggleMode.textContent = "Register here";

      groupLoginRole.style.display = 'block';
      registerFields.forEach(el => el.style.display = 'none');
      
      parentNameInput.required = false;
      learnerNameInput.required = false;
      gradeInput.required = false;

      if (emailLabel) emailLabel.textContent = "Email Address";
    }
  });

  // Handle Form Submission (Login, Register, or Admin)
  authForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideAlert();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();

    if (!supabaseClient) {
      showAlert("Database client not connected.", "error");
      return;
    }

    btnSubmit.disabled = true;

    if (isAdminMode) {
      // --- ADMIN LOGIN LOGIC ---
      btnSubmit.textContent = "Authenticating Admin...";
      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) throw error;

        // Force-update user's metadata role to admin
        await supabaseClient.auth.updateUser({
          data: { role: "admin" }
        });

        redirectUserByRole("admin");

      } catch (err) {
        showAlert(err.message || "Invalid educator credentials.", "error");
        btnSubmit.disabled = false;
        btnSubmit.textContent = "Sign In as Admin";
      }

    } else if (isRegisterMode) {
      // --- REGISTRATION LOGIC ---
      btnSubmit.textContent = "Creating Account...";
      const parentName = parentNameInput.value.trim();
      const learnerName = learnerNameInput.value.trim();
      const grade = gradeInput.value;
      const role = roleInput.value;

      if (role === 'student' && !grade) {
        showAlert("Please select a grade.", "error");
        btnSubmit.disabled = false;
        btnSubmit.textContent = "Register Account";
        return;
      }

      try {
        const { data, error } = await supabaseClient.auth.signUp({
          email: email,
          password: password,
          options: {
            data: {
              full_name: role === 'student' ? learnerName : parentName,
              learner_name: learnerName || parentName,
              parent_name: parentName,
              role: role,
              grade: grade || "N/A"
            }
          }
        });

        if (error) throw error;

        if (data.session) {
          showAlert("Account created! Redirecting...", "success");
          setTimeout(() => { redirectUserByRole(role); }, 800);
        } else {
          const { data: signInData, error: signInErr } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });

          if (signInErr) {
            showAlert("Account registered! Please click 'Sign in here' to log in.", "success");
            btnSubmit.disabled = false;
            btnSubmit.textContent = "Register Account";
          } else {
            redirectUserByRole(role);
          }
        }

      } catch (err) {
        showAlert(err.message || "Failed to register account.", "error");
        btnSubmit.disabled = false;
        btnSubmit.textContent = "Register Account";
      }

    } else {
      // --- STANDARD LOGIN LOGIC (Learner / Parent) ---
      btnSubmit.textContent = "Signing in...";
      const selectedLoginRole = loginRoleInput.value;

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) throw error;

        // Force-update user's metadata role to match their dropdown selection
        await supabaseClient.auth.updateUser({
          data: { role: selectedLoginRole }
        });

        // Redirect directly based on the dropdown selection
        redirectUserByRole(selectedLoginRole);

      } catch (err) {
        showAlert(err.message || "Invalid login credentials.", "error");
        btnSubmit.disabled = false;
        btnSubmit.textContent = "Sign In";
      }
    }
  });

  function showAlert(msg, type = "error") {
    alertMsg.textContent = msg;
    alertMsg.className = `alert alert-${type}`;
    alertMsg.style.display = 'block';
  }

  function hideAlert() {
    alertMsg.style.display = 'none';
  }
</script>
</body>
</html>
